name: Convert GBP project images to JPG
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/convert-gbp-images.yml"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Convert selected WEBP files to JPG
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          files = [
              "public/images/projects/bistrea-montaje-stand-1600.webp",
              "public/images/projects/bistrea-colocacion-grafica-1600.webp",
              "public/images/projects/bistrea-pared-naranja-1600.webp",
              "public/images/projects/bistrea-pared-verde-1600.webp",
              "public/images/projects/mila-stand-terminado-1200.webp",
              "public/images/projects/mila-stand-en-uso-1200.webp",
              "public/images/projects/mila-colocacion-grafica-1600.webp",
              "public/images/projects/mila-vista-montaje-1600.webp",
          ]

          for src in files:
              src = Path(src)
              dst = src.with_suffix(".jpg")
              with Image.open(src) as im:
                  if im.mode in ("RGBA", "LA"):
                      bg = Image.new("RGB", im.size, "white")
                      bg.paste(im, mask=im.getchannel("A"))
                      im = bg
                  else:
                      im = im.convert("RGB")
                  im.save(dst, "JPEG", quality=94, optimize=True, progressive=True)
                  print(f"{src} -> {dst}")
          PY
      - name: Commit converted images and remove temporary workflow
        run: |
          rm .github/workflows/convert-gbp-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/projects/*.jpg .github/workflows/convert-gbp-images.yml
          git commit -m "chore: add JPG variants for Google Business photos"
          git push
